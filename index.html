<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jornada de Salud — IASD</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
:root{--bg:#f8f6f1;--bg-card:#fff;--bg-surface:#f0ede5;--bg-sidebar:#1a2340;--bg-sidebar-hover:#253058;--accent:#e8973e;--accent-dark:#c77a2a;--accent-light:#fdf0e0;--blue:#3a7bd5;--blue-light:#e8f0fd;--green:#2d9f6f;--green-light:#e4f5ec;--red:#d94343;--red-light:#fde8e8;--purple:#7c5cbf;--purple-light:#f0ebfa;--text:#2c2c2c;--text-dim:#6b6b6b;--text-muted:#9a9a9a;--text-sidebar:#c8cedf;--border:rgba(0,0,0,.08);--radius:10px;--shadow:0 2px 12px rgba(0,0,0,.06);--shadow-lg:0 8px 32px rgba(0,0,0,.1)}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes callPulse{0%,100%{box-shadow:0 0 0 0 rgba(217,67,67,.4)}70%{box-shadow:0 0 0 14px rgba(217,67,67,0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes bellShake{0%{transform:rotate(0)}15%{transform:rotate(15deg)}30%{transform:rotate(-10deg)}45%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}75%{transform:rotate(2deg)}100%{transform:rotate(0)}}
.fade-up{animation:fadeUp .5s ease forwards}
.app-container{display:flex;height:100vh}
.sidebar{width:260px;background:var(--bg-sidebar);display:flex;flex-direction:column;flex-shrink:0;z-index:10}
.sidebar-brand{padding:20px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:12px}
.sidebar-brand img{width:42px;height:42px;object-fit:contain}
.sidebar-brand .brand-text h1{font-family:'Playfair Display',serif;font-size:15px;font-weight:700;color:var(--accent)}
.sidebar-brand .brand-text span{font-size:10px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1.5px;display:block;margin-top:2px}
.sidebar-nav{flex:1;padding:12px 10px;overflow-y:auto}
.nav-section{font-size:9px;text-transform:uppercase;letter-spacing:2px;color:rgba(255,255,255,.25);padding:14px 12px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;cursor:pointer;color:var(--text-sidebar);font-size:13px;transition:all .2s;margin:2px 0}
.nav-item:hover{background:var(--bg-sidebar-hover);color:#fff}.nav-item.active{background:var(--accent);color:#fff;font-weight:600}
.nav-item .nav-icon{width:20px;text-align:center;font-size:16px}
.sidebar-user{padding:16px;border-top:1px solid rgba(255,255,255,.08)}
.sidebar-user .user-info{display:flex;align-items:center;gap:10px}
.sidebar-user .user-avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px}
.sidebar-user .user-name{color:#fff;font-size:13px;font-weight:500}
.sidebar-user .user-role{color:rgba(255,255,255,.4);font-size:11px}
.sidebar-user .btn-logout{margin-top:10px;width:100%;padding:7px;border:1px solid rgba(255,255,255,.15);border-radius:6px;background:transparent;color:rgba(255,255,255,.5);font-size:12px;cursor:pointer;transition:all .2s}
.sidebar-user .btn-logout:hover{background:rgba(255,255,255,.1);color:#fff}
.main-content{flex:1;overflow-y:auto;padding:28px 32px}
.page-header{margin-bottom:24px}.page-header h2{font-family:'Playfair Display',serif;font-size:24px;font-weight:700}.page-header p{color:var(--text-dim);font-size:13px;margin-top:4px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--bg-card);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);border:1px solid var(--border)}
.stat-card .stat-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted)}.stat-card .stat-value{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;margin-top:4px}
.card{background:var(--bg-card);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:20px}
.card-title{font-family:'Playfair Display',serif;font-size:18px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.form-group{display:flex;flex-direction:column;gap:4px}.form-group label{font-size:12px;font-weight:500;color:var(--text-dim)}
.form-group input,.form-group select,.form-group textarea{padding:9px 12px;border:1px solid var(--border);border-radius:7px;font-size:13px;font-family:inherit;background:var(--bg);transition:all .2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
.btn{padding:9px 18px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .2s;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-dark);transform:translateY(-1px);box-shadow:0 4px 12px rgba(232,151,62,.3)}
.btn-secondary{background:var(--bg-surface);color:var(--text);border:1px solid var(--border)}.btn-secondary:hover{background:#e8e5dd}
.btn-success{background:var(--green);color:#fff}.btn-success:hover{background:#258a5e}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{background:#c13636}
.btn-blue{background:var(--blue);color:#fff}.btn-blue:hover{background:#2f6ac0}
.btn-sm{padding:6px 12px;font-size:12px}.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}
table th{text-align:left;padding:10px 14px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);border-bottom:2px solid var(--border);font-weight:600}
table td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px}table tr:hover{background:rgba(0,0,0,.015)}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge-wait{background:var(--accent-light);color:var(--accent-dark)}.badge-active{background:var(--blue-light);color:var(--blue)}
.badge-done{background:var(--green-light);color:var(--green)}.badge-noshow{background:var(--red-light);color:var(--red)}
.badge-cita{background:var(--purple-light);color:var(--purple)}.badge-turno{background:var(--blue-light);color:var(--blue)}
.checkbox-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.checkbox-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--border);border-radius:7px;cursor:pointer;transition:all .2s;font-size:13px}
.checkbox-item:hover{border-color:var(--accent);background:var(--accent-light)}.checkbox-item.checked{border-color:var(--accent);background:var(--accent-light)}
.checkbox-item input{accent-color:var(--accent)}.checkbox-item .cupos{font-size:11px;color:var(--text-muted);margin-left:auto}
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a2340 0%,#2a3a60 50%,#1a2340 100%);padding:20px}
.login-card{background:#fff;border-radius:16px;padding:40px;width:380px;box-shadow:var(--shadow-lg);text-align:center}
.login-card img{width:80px;margin-bottom:12px}.login-card h1{font-family:'Playfair Display',serif;font-size:22px;color:var(--accent);margin-bottom:4px}
.login-card .subtitle{font-size:12px;color:var(--text-muted);margin-bottom:24px}
.login-card .form-group{text-align:left;margin-bottom:14px}.login-card .form-group input{width:100%}
.login-card .btn{width:100%;justify-content:center;padding:12px;font-size:14px}
.login-error{color:var(--red);font-size:12px;margin-bottom:10px;display:none}
.route-steps{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.route-step{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500}
.route-step.completed{background:var(--green-light);color:var(--green)}.route-step.current{background:var(--red-light);color:var(--red);font-weight:700}
.route-step.pending{background:var(--bg-surface);color:var(--text-muted)}.route-arrow{color:var(--text-muted);font-size:10px}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:14px;padding:28px;width:90%;max-width:600px;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-title{font-family:'Playfair Display',serif;font-size:20px;margin-bottom:16px}
.tv-screen{min-height:100vh;background:linear-gradient(135deg,#0d1b2a,#1b2838,#0d1b2a);color:#fff;padding:30px 40px;font-family:'DM Sans',sans-serif}
.tv-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px;padding-bottom:20px;border-bottom:2px solid rgba(255,255,255,.1)}
.tv-header .tv-brand{display:flex;align-items:center;gap:16px}.tv-header .tv-brand img{width:60px}
.tv-header .tv-brand h1{font-family:'Playfair Display',serif;font-size:32px;color:var(--accent)}
.tv-header .tv-brand p{font-size:14px;color:rgba(255,255,255,.5)}
.tv-clock{font-family:'JetBrains Mono',monospace;font-size:36px;color:var(--accent)}
.tv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.tv-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:20px;transition:all .3s}
.tv-card.calling{background:rgba(217,67,67,.15);border-color:var(--red);animation:callPulse 2s infinite}
.tv-card .tv-consult-name{font-size:14px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:1px}
.tv-card .tv-turno{font-family:'Playfair Display',serif;font-size:48px;font-weight:800;color:var(--accent);margin:8px 0}
.tv-card.calling .tv-turno{color:var(--red)}
.tv-card .tv-patient{font-size:18px;font-weight:500}
.tv-card .tv-status{font-size:13px;margin-top:8px}.tv-card .tv-status.calling-text{color:var(--red);font-weight:700;font-size:15px;animation:pulse 1s infinite}
.tv-card .tv-queue{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.1);font-size:12px;color:rgba(255,255,255,.4)}
.search-box{display:flex;gap:8px;margin-bottom:16px}
.search-box input{flex:1;padding:9px 14px;border:1px solid var(--border);border-radius:7px;font-size:13px;font-family:inherit;background:var(--bg)}
.search-box input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
.search-box select{padding:9px 12px;border:1px solid var(--border);border-radius:7px;font-size:13px;font-family:inherit;background:var(--bg)}
.tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--bg-surface);border-radius:8px;padding:4px}
.tab-btn{padding:8px 16px;border-radius:6px;border:none;background:transparent;cursor:pointer;font-size:13px;font-family:inherit;font-weight:500;color:var(--text-dim);transition:all .2s}
.tab-btn.active{background:#fff;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.chart-bar-row{display:flex;align-items:center;gap:10px;margin:6px 0}
.chart-bar-label{font-size:12px;color:var(--text-dim);min-width:120px;text-align:right}
.chart-bar-track{flex:1;height:24px;background:var(--bg-surface);border-radius:4px;overflow:hidden}
.chart-bar-fill{height:100%;border-radius:4px;transition:width .5s ease;display:flex;align-items:center;padding-left:8px;font-size:11px;font-weight:600;color:#fff}
.chart-bar-value{font-size:12px;font-weight:600;min-width:30px}
.public-header{background:var(--bg-sidebar);padding:20px 40px;display:flex;align-items:center;gap:16px}
.public-header img{width:50px}.public-header h1{font-family:'Playfair Display',serif;color:var(--accent);font-size:22px}
.public-header p{color:rgba(255,255,255,.5);font-size:12px}
.public-body{max-width:700px;margin:30px auto;padding:0 20px}
@media(max-width:768px){.sidebar{display:none}.main-content{padding:16px}.form-grid{grid-template-columns:1fr}.stats-grid{grid-template-columns:1fr 1fr}}
@media print{.sidebar,.btn-group,.nav-item,.sidebar-user{display:none!important}.main-content{padding:0!important}.card{box-shadow:none;border:1px solid #ddd}}
</style>

function seleccionarConsultorioEquitativo(especialidad,jornada=''){
  const CS=DB.g('consultorios')||[];
  const candidatos=CS.filter(c=>c.especialidad===especialidad&&c.activo!==false);
  if(!candidatos.length)return null;
  const ordenados=candidatos.map(c=>({
    c,
    usados:DB.cuposUsados(c.id,jornada),
    disp:DB.cuposDisp(c.id,jornada)
  })).filter(x=>x.disp>0).sort((a,b)=>{
    if(a.usados!==b.usados)return a.usados-b.usados;
    if(a.disp!==b.disp)return b.disp-a.disp;
    return (a.c.num||0)-(b.c.num||0);
  });
  return ordenados.length?ordenados[0].c:null;
}

const JORNADAS=['Lunes - Libertad','Martes - Atalaya','Miércoles - Sion','Viernes - Patios'];
function esHoraTexto(v){return /^\d{2}:\d{2}$/.test(String(v||''));}
function citaJornadaLegacy(c){return esHoraTexto(c&&c.hora)?'':(c&&c.hora)||'';}
function getCitaJornada(c){return (c&&c.jornada)||citaJornadaLegacy(c)||'';}
function getCitaHora(c){return esHoraTexto(c&&c.hora)?c.hora:'';}

function jornadaActivaTriaje(){

}
function citaCorrespondeAJornada(c){
  const activa=jornadaActivaTriaje();
  if(!activa)return true;
  return getCitaJornada(c)===activa;
}
function alertaCitaJornadaIncorrecta(c){
  alert('⚠️ Esta cita no corresponde a la jornada seleccionada.\n\nJornada activa: '+jornadaActivaTriaje()+'\nCita registrada para: '+(getCitaJornada(c)||'Sin jornada')+'\n\nNo se puede activar hasta seleccionar la jornada correcta.');
}

function jornadaOptionsHTML(selected=''){
  return JORNADAS.map(j=>`<option value="${j}" ${j===selected?'selected':''}>${j}</option>`).join('');
}
function bloqueHoras(bloque){
  const arr=[];
  let start=bloque==='tarde'?14*60:8*60+30;
  let end=bloque==='tarde'?15*60+30:12*60+30;
  for(let m=start;m<=end;m+=10){arr.push(String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'));}
  return arr;
}
function llegadaAntes(hora){
  if(!esHoraTexto(hora))return '—';
  let [h,m]=hora.split(':').map(Number); let total=h*60+m-15; if(total<0)total+=24*60;
  return String(Math.floor(total/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0');
}

function fechaJornada(jornada){
  const mapa={
    'Lunes - Libertad':'Lunes 25 de mayo',
    'Martes - Atalaya':'Martes 26 de mayo',
    'Miércoles - Sion':'Miércoles 27 de mayo',
    'Viernes - Patios':'Viernes 29 de mayo'
  };
  return mapa[jornada]||'—';
}

function citaOcupaConsultorio(c,consultorioId,jornada,hora){
  return c&&c.consultorioId===consultorioId&&c.estado!=='cancelado'&&getCitaJornada(c)===jornada&&getCitaHora(c)===hora;
}
function consultorioDisponibleEnHora(consultorioId,jornada,hora){
  const CI=DB.g('citas')||[];
  return !CI.some(c=>citaOcupaConsultorio(c,consultorioId,jornada,hora));
}
function seleccionarConsultorioCita(especialidad,jornada='',hora=''){
  const CS=DB.g('consultorios')||[];
  const candidatos=CS.filter(c=>c.especialidad===especialidad&&c.activo!==false&&DB.cuposDisp(c.id,jornada)>0&&consultorioDisponibleEnHora(c.id,jornada,hora));
  if(!candidatos.length)return null;
  return candidatos.map(c=>({c,usados:DB.cuposUsados(c.id,jornada),disp:DB.cuposDisp(c.id,jornada)})).sort((a,b)=>{
    if(a.usados!==b.usados)return a.usados-b.usados;
    if(a.disp!==b.disp)return b.disp-a.disp;
    return (a.c.num||0)-(b.c.num||0);
  })[0].c;
}

function horaDisponibleParaSeleccion(hora){

function actualizarHorasCitas(){
  const sel=$('cHora'); if(!sel)return;

}

// ===== AUDIO =====
function playBell(){try{
  const c=new(window.AudioContext||window.webkitAudioContext)();
  const master=c.createGain(); master.connect(c.destination);
  master.gain.setValueAtTime(.0001,c.currentTime);
  master.gain.exponentialRampToValueAtTime(.35,c.currentTime+.03);
  master.gain.exponentialRampToValueAtTime(.01,c.currentTime+2.8);
  const notes=[659,784,988,784];
  notes.forEach((freq,i)=>{
    const o=c.createOscillator(); const g=c.createGain();
    o.type='sine'; o.frequency.setValueAtTime(freq,c.currentTime+i*.32);
    g.gain.setValueAtTime(.001,c.currentTime+i*.32);
    g.gain.exponentialRampToValueAtTime(.28,c.currentTime+i*.32+.04);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+i*.32+.55);
    o.connect(g); g.connect(master); o.start(c.currentTime+i*.32); o.stop(c.currentTime+i*.32+.65);
  });
}catch(e){console.warn('Audio bloqueado por el navegador',e)}}

async function regPaciente(){
  const doc=$('rDoc').value.trim(),nom=$('rNom').value.trim(),edad=$('rEdad').value;
  if(!doc||!nom||!edad){alert('Complete campos obligatorios: Documento, Nombre y Edad');return}
  const espSel=[];document.querySelectorAll('#espGrid input:checked').forEach(cb=>espSel.push(cb.value));
  if(!espSel.length){alert('Seleccione al menos una especialidad');return}
  const P=DB.g('pacientes')||[];
  const jor=$('rJor')?$('rJor').value:'';
  let pac=P.find(p=>p.documento===doc);
  if(pac&&turnoActivoPaciente(pac.id)){alert('Este paciente ya tiene un turno activo. Finalice la atención actual antes de crear otro turno.');return}
  if(pac&&!confirm('Esta cédula ya existe registrada como: '+pac.nombre+'\n\n¿Deseas actualizar sus datos y crear una ruta nueva con las especialidades seleccionadas ahora?'))return;
  if(!pac){
    pac={id:'p_'+Date.now(),tipoDoc:$('rTD').value,documento:doc,nombre:nom.toUpperCase(),edad:+edad,sexo:$('rSex').value,
      telefono:$('rTel').value.trim(),direccion:$('rDir').value.trim(),estadoCivil:$('rEC').value,miembro:$('rMi').value,
      iglesia:$('rIg').value.trim(),fecha:new Date().toISOString(),tipo:'turno_libre'};
    P.push(pac);DB.s('pacientes',P);
    if(window.REMOTE) await REMOTE.syncKey('pacientes',[pac]);
  }else{
    pac.nombre=nom.toUpperCase();pac.edad=+edad;pac.telefono=$('rTel').value.trim()||pac.telefono;pac.direccion=$('rDir').value.trim()||pac.direccion;
    pac.estadoCivil=$('rEC').value;pac.miembro=$('rMi').value;pac.iglesia=$('rIg').value.trim()||pac.iglesia;DB.s('pacientes',P);
    if(window.REMOTE) await REMOTE.syncKey('pacientes',[pac]);
  }
  const CS=DB.g('consultorios')||[],T=DB.g('turnos')||[],ruta=[];
  espSel.forEach(esp=>{
    const best=seleccionarConsultorioEquitativo(esp,jor);
    if(best)ruta.push(best.id);
  });
  if(!ruta.length){alert('No hay cupos disponibles para la jornada seleccionada: '+jor);return}
  const cod=DB.nextT();
  T.push({id:'t_'+Date.now(),codigo:cod,pacienteId:pac.id,consultorioId:ruta[0],estado:'esperando',
    bloque:new Date().getHours()<13?'mañana':'tarde',jornada:jor,ruta:ruta,rutaIndex:0,fecha:new Date().toISOString()});
  DB.s('turnos',T);
  if(window.REMOTE) await REMOTE.syncKey('turnos',[T[T.length-1]]);
  const info=ruta.map(cid=>{const c=CS.find(x=>x.id===cid);return c?c.especialidad+' (#'+c.num+')':''});
  alert('✅ Paciente registrado!\n\n🎫 Turno: '+cod+'\n👤 '+pac.nombre+'\n\n📋 Ruta:\n'+info.map((c,i)=>'  '+(i+1)+'. '+c).join('\n'));
  render();
}
function buscarPac(){
  const inp=$('bPac'), r=$('resBuscar');
  const q=(inp?inp.value:'').trim().toLowerCase();
  const P=DB.g('pacientes')||[],CI=DB.g('citas')||[];
  const jornada=jornadaActivaTriaje();
  const citaTexto=(c)=>{
    const p=P.find(x=>x.id===c.pacienteId);
    return [c.codigo,c.especialidad,getCitaJornada(c),getCitaHora(c),p&&p.documento,p&&p.nombre,p&&p.iglesia].join(' ').toLowerCase();
  };
  const fc=CI.filter(c=>{
    if(q)return citaTexto(c).includes(q);
    return c.estado==='pendiente' && citaCorrespondeAJornada(c);
  });
  const fp=q?P.filter(p=>String(p.documento||'').toLowerCase().includes(q)||String(p.nombre||'').toLowerCase().includes(q)):[];
  let h='';
  if(!q){
    h+=`<div style="font-size:12px;color:var(--text-dim);margin-bottom:10px">Mostrando citas pendientes de: <strong>${jornada||'todas'}</strong></div>`;
  }
  fc.forEach(c=>{const p=P.find(x=>x.id===c.pacienteId);
    h+=`<div style="padding:12px;border:1px solid var(--border);border-radius:8px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:12px">
    <div><strong>${c.codigo}</strong> — ${p?p.nombre:'—'} ${p?`<span style="color:var(--text-muted)">(${p.documento})</span>`:''}<br><span style="font-size:12px;color:var(--text-dim)">${c.especialidad} · ${getCitaJornada(c)||'—'} · ${getCitaHora(c)||'sin hora'} · Llegar ${llegadaAntes(getCitaHora(c))}</span></div>
    ${c.estado==='pendiente'?(citaCorrespondeAJornada(c)?`<button class="btn btn-sm btn-primary" onclick="abrirTriajeCita('${c.id}')">Registrar triaje y activar</button>`:`<button class="btn btn-sm btn-secondary" onclick="alertaCitaJornadaIncorrecta((DB.g('citas')||[]).find(x=>x.id==='${c.id}'))">No corresponde a esta jornada</button>`):`<span class="badge badge-done">${c.estado}</span>`}</div>`});
  fp.forEach(p=>{const t=(DB.g('turnos')||[]).filter(x=>x.pacienteId===p.id), citas=CI.filter(c=>c.pacienteId===p.id&&c.estado==='pendiente');
    h+=`<div style="padding:10px;border:1px solid var(--border);border-radius:8px;margin:6px 0"><strong>${p.nombre}</strong> — ${p.documento}<br><span style="font-size:12px;color:var(--text-dim)">Turnos: ${t.map(x=>x.codigo).join(', ')||'Ninguno'} · Citas pendientes: ${citas.length}</span></div>`});
  if(!h || h.trim()==='<div style="font-size:12px;color:var(--text-dim);margin-bottom:10px">Mostrando citas pendientes de: <strong>'+jornada+'</strong></div>'){
    h='<p style="color:var(--text-muted);font-size:13px;padding:12px">No hay citas pendientes para la jornada seleccionada. También puedes buscar por documento, nombre o código.</p>';
  }
  r.innerHTML=h;
}

function abrirTriajeCita(cid){

async function crearCita(){
  const doc=$('cDoc').value.trim(),nom=$('cNom').value.trim();
  if(!doc||!nom){alert('Complete documento y nombre');return}
  const espSel=[];document.querySelectorAll('#cEspG input:checked').forEach(cb=>espSel.push(cb.value));
  if(!espSel.length){alert('Seleccione al menos una especialidad');return}
  const blq=$('cBlq').value,jor=($('cJor')?$('cJor').value:''),horaExacta=($('cHora')?$('cHora').value:'');
  if(!horaExacta){alert('Seleccione una hora disponible para la cita');return}
  let P=DB.g('pacientes')||[],pac=P.find(p=>p.documento===doc);
  if(pac&&!confirm('Esta cédula ya existe registrada como: '+pac.nombre+'\n\n¿Deseas actualizar sus datos y crear una nueva cita con la ruta seleccionada ahora?'))return;
  if(!pac){
    pac={id:'p_'+Date.now(),tipoDoc:$('cTD').value,documento:doc,nombre:nom.toUpperCase(),edad:+($('cEdad').value)||0,sexo:$('cSex').value,
      telefono:$('cTel').value.trim(),direccion:$('cDir').value.trim(),estadoCivil:$('cEC').value,miembro:$('cMi').value,
      iglesia:$('cIg').value.trim(),fecha:new Date().toISOString(),tipo:'cita_previa'};
    P.push(pac);
  }else{
    pac.tipoDoc=$('cTD').value;pac.nombre=nom.toUpperCase();pac.edad=+($('cEdad').value)||pac.edad||0;pac.sexo=$('cSex').value;
    pac.telefono=$('cTel').value.trim()||pac.telefono||'';pac.direccion=$('cDir').value.trim()||pac.direccion||'';
    pac.estadoCivil=$('cEC').value;pac.miembro=$('cMi').value;pac.iglesia=$('cIg').value.trim()||pac.iglesia||'';pac.tipo='cita_previa';
  }
  DB.s('pacientes',P);
  if(window.REMOTE) await REMOTE.syncKey('pacientes',[pac]);
  if(citaActivaPaciente(pac.id)){alert('Este paciente ya tiene una cita activa. Busque la cita existente o actívela en registro.');return}
  const ruta=[];
  for(const esp of espSel){
    const best=seleccionarConsultorioCita(esp,jor,horaExacta);
    if(!best){alert('No hay horario disponible a las '+horaExacta+' para '+esp+' en '+jor+'. Seleccione otra hora.');actualizarHorasCitas();return}
    ruta.push(best.id);
  }
  if(!ruta.length){alert('No hay cupos');return}
  const cod=DB.nextCi(),CI=DB.g('citas')||[];
  const nuevaCita={id:'ci_'+Date.now(),codigo:cod,pacienteId:pac.id,consultorioId:ruta[0],especialidad:espSel.join(', '),
    bloque:blq,jornada:jor,hora:horaExacta,ruta:ruta,estado:'pendiente',fecha:new Date().toISOString()};
  CI.push(nuevaCita);DB.s('citas',CI);
  if(window.REMOTE) await REMOTE.syncKey('citas',[nuevaCita]);
  alert('✅ Cita agendada!\n📅 '+cod+'\n👤 '+pac.nombre+'\n📍 '+jor+'\n🕐 Hora cita: '+horaExacta+'\n⏱️ Debe llegar: '+llegadaAntes(horaExacta));render();
}

  return`<span class="route-step ${cls}">${cc?cc.especialidad.substring(0,12):''}</span>`}).join('<span class="route-arrow">→</span>');

async function enviarOtroConsultorio(tid){
  const T=DB.g('turnos')||[],CS=DB.g('consultorios')||[];
  const t=T.find(x=>x.id===tid); if(!t)return;
  const jor=DB.jornadaTurno(t);
  const opciones=CS.filter(c=>c.id!==t.consultorioId&&DB.cuposDisp(c.id,jor)>0)
    .sort((a,b)=>a.num-b.num);
  if(!opciones.length){alert('No hay otros consultorios con cupos disponibles para esta jornada.');return}
  const lista=opciones.map(c=>`#${c.num} - ${c.especialidad} (${DB.cuposDisp(c.id,jor)} cupos)`).join('\n');
  const num=prompt('Escribe el número del consultorio al que deseas enviar el turno:\n\n'+lista);
  if(!num)return;
  const dest=opciones.find(c=>String(c.num)===String(num).trim());
  if(!dest){alert('Número de consultorio no válido.');return}
  t.consultorioId=dest.id;
  t.estado='esperando';
  t.horaLlamado=null;
  if(!Array.isArray(t.ruta))t.ruta=[];
  let idx=t.ruta.indexOf(dest.id);
  if(idx<0){t.ruta.splice((t.rutaIndex||0)+1,0,dest.id);idx=t.ruta.indexOf(dest.id);}
  t.rutaIndex=idx;
  DB.s('turnos',T);
  if(window.REMOTE)await REMOTE.syncKey('turnos',[t]);
  alert('Turno enviado a consultorio #'+dest.num+' — '+dest.especialidad);
  render();
}

function filtT(){
  const q=($('fT')||{}).value?.toLowerCase()||'',e=($('fE')||{}).value||'';
  let T=DB.g('turnos')||[];const P=DB.g('pacientes')||[],CS=DB.g('consultorios')||[];
  if(e)T=T.filter(t=>t.estado===e);
  if(q)T=T.filter(t=>{const p=P.find(x=>x.id===t.pacienteId);return t.codigo.toLowerCase().includes(q)||(p&&p.nombre.toLowerCase().includes(q))});
  $('tTbl').innerHTML=tblTurnos(T,P,CS);
}

}
async function rellamar(tid){
  const T=DB.g('turnos')||[],t=T.find(x=>x.id===tid);if(!t)return;

async function volverEspera(tid){

}

async function pasarSiguiente(tid,cid){
  const T=DB.g('turnos')||[],t=T.find(x=>x.id===tid);if(!t)return;

}
async function noLlego(tid){

  const T=DB.g('turnos')||[],t=T.find(x=>x.id===tid);if(!t)return;
  const relacionados=T.filter(x=>x.codigo===t.codigo&&x.pacienteId===t.pacienteId&&x.estado!=='atendido');
  relacionados.forEach(x=>{x.estado='cancelado';x.horaLlamado=null;x.horaCancelado=new Date().toISOString();});
  DB.s('turnos',T);if(window.REMOTE)await REMOTE.syncKey('turnos',relacionados);
  render();
}

function addMed(){const n=$('mN').value.trim();if(!n)return;tempMeds.push({nombre:n,dosis:$('mD').value.trim(),frecuencia:$('mF').value.trim(),duracion:$('mDu').value.trim()});
  $('mN').value='';$('mD').value='';$('mF').value='';$('mDu').value='';renderML()}
function renderML(){const el=$('medL');if(!el)return;if(!tempMeds.length){el.innerHTML='';return}
  el.innerHTML=tempMeds.map((m,i)=>`<div style="display:flex;justify-content:space-between;padding:6px 10px;background:var(--bg-surface);border-radius:6px;margin:4px 0;font-size:13px">
  <span><strong>${m.nombre}</strong> — ${m.dosis} · ${m.frecuencia} · ${m.duracion}</span>
  <button onclick="tempMeds.splice(${i},1);renderML()" style="border:none;background:none;color:var(--red);cursor:pointer">✕</button></div>`).join('')}
async function llamar(cid, excluirId=null){
  const T=DB.g('turnos')||[];
  if(T.find(t=>t.consultorioId===cid&&['llamando','en_atencion'].includes(t.estado))){alert('Ya hay un paciente llamado o en atención. Confirme llegada, páselo a espera o finalice antes de llamar otro.');return}
  const P=DB.g('pacientes')||[];
  const esp=T.filter(t=>{
      if(!(t.consultorioId===cid&&t.estado==='esperando'&&t.id!==excluirId))return false;
      if(!t.citaId)return true;
      const p=P.find(x=>x.id===t.pacienteId);
      return !!(p&&p.triajeRealizado);
    })
    .sort((a,b)=>new Date(a.pospuestoEn||a.fecha)-new Date(b.pospuestoEn||b.fecha));
  if(!esp.length){alert(excluirId?'No hay otro paciente en espera. El paciente quedó nuevamente en cola.':'No hay pacientes disponibles. Si hay citas pendientes, deben pasar primero por Registro/Triaje.');return}
  const citas=esp.filter(t=>t.citaId),next=citas.length?citas[0]:esp[0];
  next.estado='llamando';next.horaLlamado=new Date().toISOString();DB.s('turnos',T);
  if(window.REMOTE)await REMOTE.syncKey('turnos',[next]);
  playBell();tempMeds=[];render();
}
function finCon(tid,cid,silent=false){
  const T=DB.g('turnos')||[],t=T.find(x=>x.id===tid);if(!t)return;
  const CO=DB.g('consultas')||[];
  CO.push({id:'co_'+Date.now(),turnoId:tid,pacienteId:t.pacienteId,consultorioId:cid,
    motivo:($('cMot')||{}).value||'',diagnostico:($('cDiag')||{}).value||'',tratamiento:($('cTrat')||{}).value||'',
    medicamentos:[...tempMeds, ...( (($('mN')&&$('mN').value.trim()) ? [{nombre:$('mN').value.trim(),dosis:($('mD')||{}).value||'',frecuencia:($('mF')||{}).value||'',duracion:($('mDu')||{}).value||''}] : []) )],fecha:new Date().toISOString()});
  DB.s('consultas',CO);t.estado='atendido';t.horaFin=new Date().toISOString();
  if(t.ruta&&t.rutaIndex<t.ruta.length-1){
    const ni=t.rutaIndex+1;
    T.push({id:'t_'+Date.now(),codigo:t.codigo,pacienteId:t.pacienteId,consultorioId:t.ruta[ni],estado:'esperando',
      bloque:t.bloque,jornada:t.jornada||DB.jornadaTurno(t),horaCita:t.horaCita||'',ruta:t.ruta,rutaIndex:ni,citaId:t.citaId,fecha:new Date().toISOString()});
  }
  DB.s('turnos',T);tempMeds=[];
  if(!silent)alert('✅ Consulta finalizada'+(t.ruta&&t.rutaIndex<t.ruta.length-1?'\nEl paciente pasó al siguiente consultorio.':'\nRuta finalizada.'));
  render();
}

// ===== MÓDULO IMPRESIÓN DE FÓRMULAS =====
function consultaTieneFormula(co){
  return !!(co&&(co.diagnostico||co.tratamiento||co.motivo||(co.medicamentos&&co.medicamentos.length)));
}
function estadoFormula(co){
  if(co.formulaEntregada)return '<span class="badge badge-done">Entregada</span>';
  if(co.formulaImpresa)return '<span class="badge badge-active">Impresa</span>';
  return '<span class="badge badge-wait">Pendiente</span>';
}
function fechaCorta(v){try{return v?new Date(v).toLocaleString('es-CO'):''}catch(e){return v||''}}
function datosConsultaFormula(co){
  const P=DB.g('pacientes')||[],CS=DB.g('consultorios')||[],T=DB.g('turnos')||[],CI=DB.g('citas')||[];
  const p=P.find(x=>x.id===co.pacienteId)||{};
  const cons=CS.find(x=>x.id===co.consultorioId)||{};
  const t=T.find(x=>x.id===co.turnoId)||{};
  const cita=CI.find(x=>x.id===t.citaId)||{};
  const jornada=t.jornada||getCitaJornada(cita)||'';
  return {p,cons,t,cita,jornada};
}
function htmlFormulaConsulta(co,{soloCuerpo=false}={}){
  const cfg=DB.g('config')||{nombre:'Jornada de Salud IASD',ubicacion:'Iglesia Adventista del Séptimo Día'};
  const {p,cons,t,jornada}=datosConsultaFormula(co);
  const meds=co.medicamentos||[];
  const cuerpo=`
  <section class="formula-page">
    <div class="hd"><div><h2>${cfg.nombre}</h2><p>${cfg.ubicacion}</p><p>Ciudad: Cúcuta · Fecha: ${new Date().toLocaleDateString('es-CO')}</p></div>
    <div style="text-align:right"><p><strong>FÓRMULA MÉDICA</strong></p><p>${cons.especialidad||'—'}</p><p>Consultorio #${cons.num||'—'}</p></div></div>
    <div class="sec"><h4>Paciente</h4><div class="info"><strong>Nombre:</strong> ${p.nombre||'—'} · <strong>Doc:</strong> ${p.documento||'—'} · <strong>Edad:</strong> ${p.edad||'—'} años<br>
    <strong>Iglesia:</strong> ${p.iglesia||'—'} · <strong>Distrito/Jornada:</strong> ${jornada||'—'}<br>
    <strong>Triaje:</strong> Presión ${p.presion||'—'} · Peso ${p.peso||'—'} · Altura ${p.altura||'—'}</div></div>
    <div class="sec"><h4>Médico / Consulta</h4><div class="info"><strong>Médico:</strong> ${cons.medico||'—'}<br><strong>Turno:</strong> ${t.codigo||'—'} · <strong>Hora registro:</strong> ${fechaCorta(co.fecha)}</div></div>
    ${co.motivo?'<div class="sec"><h4>Motivo</h4><p>'+co.motivo+'</p></div>':''}
    ${co.diagnostico?'<div class="sec"><h4>Diagnóstico</h4><p>'+co.diagnostico+'</p></div>':''}
    ${co.tratamiento?'<div class="sec"><h4>Tratamiento</h4><p>'+co.tratamiento+'</p></div>':''}
    ${meds.length?'<div class="sec"><h4>Fórmula médica / Medicamentos</h4><table><tr><th>Medicamento</th><th>Dosis</th><th>Frecuencia</th><th>Duración</th></tr>'+meds.map(m=>'<tr><td>'+(m.nombre||m.medicamento||'')+'</td><td>'+(m.dosis||'')+'</td><td>'+(m.frecuencia||'')+'</td><td>'+(m.duracion||'')+'</td></tr>').join('')+'</table></div>':'<div class="sec"><h4>Fórmula médica / Medicamentos</h4><p>Sin medicamentos registrados.</p></div>'}
    <div class="jn">${cfg.nombre} — ${cfg.ubicacion}<br>Iglesia Adventista del Séptimo Día</div>
  </section>`;
  if(soloCuerpo)return cuerpo;
  return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Fórmula médica</title>${estiloFormulaPrint()}</head><body>${cuerpo}</body></html>`;
}
function estiloFormulaPrint(){return `<style>
  body{font-family:Arial,sans-serif;max-width:760px;margin:0 auto;padding:20px;color:#222}.formula-page{page-break-after:always;margin-bottom:30px}.formula-page:last-child{page-break-after:auto}
  .hd{display:flex;justify-content:space-between;border-bottom:3px solid #e8973e;padding-bottom:10px;margin-bottom:16px}.hd h2{color:#e8973e;margin:0;font-size:18px}.hd p{margin:2px 0;font-size:11px;color:#555}
  .sec{margin:12px 0}.sec h4{font-size:13px;color:#e8973e;margin:0 0 6px;border-bottom:1px solid #eee;padding-bottom:4px}.sec p,.info{font-size:13px;line-height:1.65}
  table{width:100%;border-collapse:collapse;margin:8px 0;font-size:12px}th{text-align:left;padding:6px 8px;background:#f8f6f1;border:1px solid #ddd}td{padding:6px 8px;border:1px solid #ddd}.jn{text-align:center;font-size:10px;color:#777;margin-top:20px;border-top:1px solid #eee;padding-top:8px}
  @media print{body{max-width:none;padding:8mm}.formula-page{page-break-after:always}.formula-page:last-child{page-break-after:auto}}
  </style>`}
async function marcarConsulta(coid,campo){
  const CO=DB.g('consultas')||[],co=CO.find(x=>x.id===coid);if(!co)return;
  if(campo==='impresa'){co.formulaImpresa=true;co.formulaImpresaEn=new Date().toISOString();}
  if(campo==='entregada'){co.formulaImpresa=true;co.formulaEntregada=true;co.formulaImpresaEn=co.formulaImpresaEn||new Date().toISOString();}
  DB.s('consultas',CO);if(window.REMOTE)await REMOTE.syncKey('consultas',[co]);
}
async function imprimirConsulta(coid){
  const co=(DB.g('consultas')||[]).find(x=>x.id===coid);if(!co)return;
  const w=window.open('','_blank');w.document.write(htmlFormulaConsulta(co));w.document.close();setTimeout(()=>w.print(),500);
  await marcarConsulta(coid,'impresa');render();
}
async function imprimirPacienteFormulas(pid){
  const formulas=(DB.g('consultas')||[]).filter(co=>co.pacienteId===pid&&consultaTieneFormula(co));
  if(!formulas.length){alert('Este paciente todavía no tiene fórmulas registradas.');return}
  const h=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Fórmulas del paciente</title>${estiloFormulaPrint()}</head><body>${formulas.map(co=>htmlFormulaConsulta(co,{soloCuerpo:true})).join('')}</body></html>`;
  const w=window.open('','_blank');w.document.write(h);w.document.close();setTimeout(()=>w.print(),500);
  for(const co of formulas)await marcarConsulta(co.id,'impresa');
  render();
}
async function marcarEntregada(coid){await marcarConsulta(coid,'entregada');render();}
function formulasFiltradas(){
  const q=($('impQ')?$('impQ').value:'').trim().toLowerCase();
  const filtro=$('impEstado')?$('impEstado').value:'pendientes';
  const CO=(DB.g('consultas')||[]).filter(consultaTieneFormula),P=DB.g('pacientes')||[],CS=DB.g('consultorios')||[];
  return CO.filter(co=>{
    const p=P.find(x=>x.id===co.pacienteId)||{},c=CS.find(x=>x.id===co.consultorioId)||{};
    const txt=[p.nombre,p.documento,p.iglesia,c.especialidad,c.medico,co.diagnostico,co.tratamiento].join(' ').toLowerCase();
    const estadoOk=filtro==='todas'||(filtro==='pendientes'&&!co.formulaImpresa)||(filtro==='impresas'&&co.formulaImpresa&&!co.formulaEntregada)||(filtro==='entregadas'&&co.formulaEntregada);
    return estadoOk&&(!q||txt.includes(q));
  }).sort((a,b)=>new Date(b.fecha||0)-new Date(a.fecha||0));
}
function renderTablaImpresion(){
  const el=$('impResultados');if(!el)return;
  const rows=formulasFiltradas();const P=DB.g('pacientes')||[],CS=DB.g('consultorios')||[];
  if(!rows.length){el.innerHTML='<p style="color:var(--text-muted);font-size:13px">No hay fórmulas con ese filtro.</p>';return}
  const agrupados={};rows.forEach(co=>{(agrupados[co.pacienteId]||(agrupados[co.pacienteId]=[])).push(co)});
  el.innerHTML=Object.entries(agrupados).map(([pid,arr])=>{const p=P.find(x=>x.id===pid)||{};
    return `<div style="border:1px solid var(--border);border-radius:10px;margin-bottom:12px;overflow:hidden"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--bg-surface);padding:10px 12px"><div><strong>${p.nombre||'—'}</strong><br><span style="font-size:12px;color:var(--text-dim)">${p.documento||'—'} · ${p.iglesia||'Sin iglesia'} · ${arr.length} fórmula(s)</span></div><button class="btn btn-sm btn-primary" onclick="imprimirPacienteFormulas('${pid}')">🖨️ Imprimir todas</button></div>
    <div class="table-wrap"><table><tr><th>Fecha</th><th>Consultorio</th><th>Diagnóstico</th><th>Estado</th><th>Acciones</th></tr>${arr.map(co=>{const c=CS.find(x=>x.id===co.consultorioId)||{};return `<tr><td>${fechaCorta(co.fecha)}</td><td>#${c.num||'—'} ${c.especialidad||'—'}<br><span style="font-size:11px;color:var(--text-muted)">${c.medico||''}</span></td><td>${co.diagnostico||'—'}</td><td>${estadoFormula(co)}</td><td><button class="btn btn-sm btn-blue" onclick="imprimirConsulta('${co.id}')">Imprimir</button> <button class="btn btn-sm btn-success" onclick="marcarEntregada('${co.id}')">Entregada</button></td></tr>`}).join('')}</table></div></div>`}).join('');
}
function pgImpresion(el){
  const total=(DB.g('consultas')||[]).filter(consultaTieneFormula).length;
  const pend=(DB.g('consultas')||[]).filter(co=>consultaTieneFormula(co)&&!co.formulaImpresa).length;
  const ent=(DB.g('consultas')||[]).filter(co=>consultaTieneFormula(co)&&co.formulaEntregada).length;
  el.innerHTML=`<div class="page-header"><h2>Impresión de Fórmulas</h2><p>Módulo central para imprimir fórmulas médicas de todos los consultorios</p></div>
  <div class="stats-grid"><div class="stat-card"><div class="stat-label">Pendientes</div><div class="stat-value" style="color:var(--accent)">${pend}</div></div><div class="stat-card"><div class="stat-label">Total fórmulas</div><div class="stat-value">${total}</div></div><div class="stat-card"><div class="stat-label">Entregadas</div><div class="stat-value" style="color:var(--green)">${ent}</div></div></div>
  <div class="card"><div class="card-title">🔎 Buscar fórmulas</div><div class="form-grid"><div class="form-group"><label>Buscar por nombre, documento, iglesia, médico o especialidad</label><input id="impQ" oninput="renderTablaImpresion()" placeholder="Ej: Juan, 1090, Libertad, Pediatría"></div><div class="form-group"><label>Estado</label><select id="impEstado" onchange="renderTablaImpresion()"><option value="pendientes">Pendientes por imprimir</option><option value="impresas">Impresas sin entregar</option><option value="entregadas">Entregadas</option><option value="todas">Todas</option></select></div></div></div>
  <div class="card"><div class="card-title">📄 Fórmulas</div><div id="impResultados"></div></div>`;

}

// ===== TV SCREEN =====
function renderTV(){
  const CS=DB.g('consultorios')||[],T=DB.g('turnos')||[],P=DB.g('pacientes')||[],cfg=DB.g('config');
  const clock=new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit',second:'2-digit'});

  // Flujo correcto: llamando aparece rojo en TV; en_atencion aparece como atención normal
  const active=CS.map(c=>{
    const llam=T.find(t=>t.consultorioId===c.id&&t.estado==='llamando');
    const enAt=T.find(t=>t.consultorioId===c.id&&t.estado==='en_atencion');
    const esp=T.filter(t=>t.consultorioId===c.id&&t.estado==='esperando');
    const turnoActual=llam||enAt;
    const pac=turnoActual?P.find(x=>x.id===turnoActual.pacienteId):null;
    return{c,llam,enAt,esp,pac};
  });
  const callingCards=active.filter(a=>a.llam);
  const atendiendo=active.filter(a=>!a.llam&&a.enAt);
  const conEspera=active.filter(a=>!a.llam&&!a.enAt&&a.esp.length>0);
  const libres=active.filter(a=>!a.llam&&!a.enAt&&a.esp.length===0);

  // Build calling section (big cards)
  const callingHTML=callingCards.length?`
    <div style="margin-bottom:28px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
        <span style="font-size:28px">🔔</span>
        <h2 style="font-family:'Playfair Display',serif;font-size:28px;color:var(--red);margin:0">PASAR A CONSULTORIO</h2>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:20px">
        ${callingCards.map(a=>`
          <div style="background:rgba(217,67,67,.12);border:2px solid var(--red);border-radius:16px;padding:28px;animation:callPulse 2s infinite">
            <div style="display:flex;justify-content:space-between;align-items:flex-start">
              <div>
                <div style="font-size:14px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:2px">#${a.c.num} · ${a.c.especialidad}</div>
                <div style="font-family:'Playfair Display',serif;font-size:72px;font-weight:800;color:var(--red);line-height:1;margin:8px 0">${a.llam.codigo}</div>
              </div>
              <div style="text-align:right">
                <div style="font-size:13px;color:rgba(255,255,255,.4)">Dr(a).</div>
                <div style="font-size:16px;font-weight:500">${a.c.medico.split(' ').slice(0,2).join(' ')}</div>
              </div>
            </div>
            <div style="font-size:26px;font-weight:600;margin-top:4px">${a.pac?a.pac.nombre:'—'}</div>
            <div style="color:var(--red);font-weight:700;font-size:18px;margin-top:8px;animation:pulse 1s infinite">▶ PASAR A CONSULTORIO #${a.c.num}</div>
          </div>`).join('')}
      </div>
    </div>`:'';

  // Summary table for all others
  const tableRows=[...atendiendo,...conEspera,...libres];
  const tableHTML=`
    <div style="background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:14px;overflow:hidden">
      <table style="width:100%;border-collapse:collapse">
        <thead><tr style="border-bottom:2px solid rgba(255,255,255,.1)">
          <th style="text-align:left;padding:14px 18px;font-size:13px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1.5px;font-weight:600">Consultorio</th>
          <th style="text-align:left;padding:14px 18px;font-size:13px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1.5px;font-weight:600">Turno</th>
          <th style="text-align:left;padding:14px 18px;font-size:13px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1.5px;font-weight:600">Paciente</th>
          <th style="text-align:left;padding:14px 18px;font-size:13px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1.5px;font-weight:600">Estado</th>
          <th style="text-align:center;padding:14px 18px;font-size:13px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1.5px;font-weight:600">Espera</th>
        </tr></thead>
        <tbody>
          ${tableRows.map(a=>{
            const isAct=!!a.enAt;
            const rowBg=isAct?'rgba(58,123,213,.08)':'transparent';
            const turnoColor=isAct?'var(--accent)':'rgba(255,255,255,.2)';
            const statusText=isAct?'En atención':a.esp.length?'En espera':'Libre';
            const statusColor=isAct?'var(--blue)':a.esp.length?'var(--accent)':'rgba(255,255,255,.2)';
            return`<tr style="border-bottom:1px solid rgba(255,255,255,.06);background:${rowBg}">
              <td style="padding:12px 18px;font-size:16px"><strong style="color:var(--accent)">#${a.c.num}</strong> <span style="color:rgba(255,255,255,.5);font-size:14px">${a.c.especialidad}</span></td>
              <td style="padding:12px 18px;font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;color:${turnoColor}">${a.enAt?a.enAt.codigo:'—'}</td>
              <td style="padding:12px 18px;font-size:16px;font-weight:${isAct?'500':'400'};color:${isAct?'#fff':'rgba(255,255,255,.3)'}">${a.pac?a.pac.nombre:isAct?'—':'—'}</td>
              <td style="padding:12px 18px"><span style="display:inline-block;padding:4px 14px;border-radius:20px;font-size:12px;font-weight:600;background:${statusColor};color:#fff">${statusText}</span></td>
              <td style="padding:12px 18px;text-align:center;font-size:18px;font-weight:600;color:${a.esp.length?'var(--accent)':'rgba(255,255,255,.15)'}">${a.esp.length}</td>
            </tr>`;}).join('')}
        </tbody>
      </table>
    </div>`;

  // No activity message
  const noActivity=!callingCards.length&&!atendiendo.length&&!conEspera.length?
    `<div style="text-align:center;padding:60px 0;opacity:.4">
      <div style="font-size:48px;margin-bottom:12px">🏥</div>
      <p style="font-size:20px">La jornada aún no ha comenzado</p>
      <p style="font-size:14px;margin-top:4px">Los turnos aparecerán aquí cuando inicie la atención</p>
    </div>`:'';

  $('app').innerHTML=`<div class="tv-screen">
  <div class="tv-header">
    <div class="tv-brand"><img src="${LOGO}" alt="IASD"><div><h1>${cfg.nombre}</h1><p>${cfg.ubicacion}</p></div></div>
    <div style="text-align:right"><div class="tv-clock" id="tvClock">${clock}</div><p style="font-size:12px;color:rgba(255,255,255,.3)">${cfg.fecha}</p>
    <button id="tvSoundBtn" onclick="window._tvAudioEnabled=true;playBell();this.textContent='🔊 Sonido activo';this.style.opacity='.7'" style="margin-top:8px;padding:8px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;cursor:pointer">🔈 Activar sonido</button></div>
  </div>
  ${callingHTML}${noActivity}${tableHTML}
  </div>`;

  if(window._tvInterval)clearInterval(window._tvInterval);
  window._tvInterval=setInterval(()=>{
    const el=document.getElementById('tvClock');
    if(el)el.textContent=new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  },1000);
  if(window._tvRefresh)clearInterval(window._tvRefresh);
  window._tvRefresh=setInterval(()=>{if(location.hash==='#tv')renderTV()},5000);
  const callingNow=T.filter(t=>t.estado==='llamando');
  if(callingNow.length>0 && window._tvAudioEnabled && Date.now()-(window._tvLastBell||0)>6000){
    window._tvLastBell=Date.now();
    playBell();
  }
}

function renderPublicAgendar(){
  const E=DB.getEsp(),cfg=DB.g('config');
  $('app').innerHTML=`<div style="min-height:100vh;background:var(--bg)">
  <div class="public-header"><img src="${LOGO}" alt="IASD"><div><h1>${cfg.nombre}</h1><p>${cfg.ubicacion} · ${cfg.fecha}</p></div></div>
  <div class="public-body">
    <div class="card fade-up"><div class="card-title">📅 Agendar Cita Previa</div>
    <p style="font-size:13px;color:var(--text-dim);margin-bottom:16px">Complete sus datos para agendar una cita. Presente el comprobante el día de la jornada.</p>
    <div class="form-grid">
      <div class="form-group"><label>Tipo Doc.</label><select id="pTD"><option>CC</option><option>TI</option><option>CE</option><option>Pasaporte</option></select></div>
      <div class="form-group"><label>Nº Documento *</label><input id="pDoc"></div>
      <div class="form-group"><label>Nombre completo *</label><input id="pNom"></div>
      <div class="form-group"><label>Edad</label><input type="number" id="pEdad" min="0" max="120"></div>
      <div class="form-group"><label>Sexo</label><select id="pSex"><option value="M">Masculino</option><option value="F">Femenino</option></select></div>
      <div class="form-group"><label>Teléfono *</label><input id="pTel"></div>
      <div class="form-group"><label>Dirección</label><input id="pDir"></div>
      <div class="form-group"><label>Iglesia procedencia</label><input id="pIg"></div>
      <div class="form-group"><label>Día / Distrito de jornada</label><select id="pJor">
        <option value="Lunes - Libertad">Lunes - Libertad</option>
        <option value="Martes - Atalaya">Martes - Atalaya</option>
        <option value="Miércoles - Sion">Miércoles - Sion</option>
        <option value="Viernes - Patios">Viernes - Patios</option>
      </select></div>
    </div>
    <div style="margin-top:16px"><label style="font-size:12px;font-weight:500;color:var(--text-dim);display:block;margin-bottom:6px">Especialidades que necesita:</label>
    <div class="checkbox-grid" id="pEspG">${Object.entries(E).map(([e,d])=>{const cd=d.cons.reduce((s,c)=>s+DB.cuposDisp(c.id),0);
    return cd>0?`<label class="checkbox-item"><input type="checkbox" value="${e}" onchange="this.parentElement.classList.toggle('checked',this.checked)"> ${e}<span class="cupos">${cd} disp.</span></label>`:''}).join('')}</div></div>
    <div class="form-grid" style="margin-top:12px"><div class="form-group"><label>Bloque horario</label><select id="pBlq"><option value="mañana">Mañana (8:30-12:30)</option><option value="tarde">Tarde (2:00-3:30)</option></select></div></div>
    <div class="btn-group"><button class="btn btn-primary" onclick="pubCita()">📅 Agendar mi cita</button>
    <a href="#" class="btn btn-secondary" onclick="render()">← Volver al login</a></div>
    </div>
    <div id="pubResult"></div>
  </div></div>`;
}
async function pubCita(){
  const doc=$('pDoc').value.trim(),nom=$('pNom').value.trim();
  if(!doc||!nom){alert('Complete documento y nombre');return}
  const espSel=[];document.querySelectorAll('#pEspG input:checked').forEach(cb=>espSel.push(cb.value));
  if(!espSel.length){alert('Seleccione al menos una especialidad');return}
  let P=DB.g('pacientes')||[],pac=P.find(p=>p.documento===doc);
  if(!pac){
    pac={id:'p_'+Date.now(),tipoDoc:$('pTD').value,documento:doc,nombre:nom.toUpperCase(),edad:+($('pEdad').value)||0,sexo:$('pSex').value,
      telefono:$('pTel').value.trim(),direccion:$('pDir').value.trim(),estadoCivil:'',miembro:'no',
      iglesia:$('pIg').value.trim(),fecha:new Date().toISOString(),tipo:'cita_previa'};
    P.push(pac);
  }else{
    pac.tipoDoc=$('pTD').value;
    pac.nombre=nom.toUpperCase();
    pac.edad=+($('pEdad').value)||pac.edad||0;
    pac.sexo=$('pSex').value;
    pac.telefono=$('pTel').value.trim()||pac.telefono||'';
    pac.direccion=$('pDir').value.trim()||pac.direccion||'';
    pac.iglesia=$('pIg').value.trim()||pac.iglesia||'';
    pac.tipo='cita_previa';
  }
  DB.s('pacientes',P);
  if(window.REMOTE) await REMOTE.syncKey('pacientes',[pac]);
  if(citaActivaPaciente(pac.id)){alert('Ya existe una cita activa para este documento.');return}
  const CS=DB.g('consultorios')||[],blq=$('pBlq').value,jor=($('pJor')?$('pJor').value:''),ruta=[];
  espSel.forEach(esp=>{const cc=CS.filter(c=>c.especialidad===esp);let best=null,bd=-1;
    cc.forEach(c=>{const d=DB.cuposDisp(c.id);if(d>bd){bd=d;best=c}});if(best&&bd>0)ruta.push(best.id)});
  if(!ruta.length){alert('No hay cupos disponibles en este momento');return}
  const cod=DB.nextCi(),CI=DB.g('citas')||[];
  const nuevaCita={id:'ci_'+Date.now(),codigo:cod,pacienteId:pac.id,consultorioId:ruta[0],especialidad:espSel.join(', '),
    bloque:blq,hora:jor,ruta:ruta,estado:'pendiente',fecha:new Date().toISOString()};
  CI.push(nuevaCita);
  DB.s('citas',CI);
  if(window.REMOTE) await REMOTE.syncKey('citas',[nuevaCita]);
  const info=ruta.map(cid=>{const c=CS.find(x=>x.id===cid);return c?c.especialidad+' (Cons. #'+c.num+')':''});
  $('pubResult').innerHTML=`<div class="card fade-up" style="border-left:4px solid var(--green);margin-top:16px">
    <div class="card-title" style="color:var(--green)">✅ ¡Cita agendada exitosamente!</div>
    <p style="font-family:'Playfair Display',serif;font-size:28px;color:var(--accent);margin:12px 0;letter-spacing:3px">${cod}</p>
    <p><strong>Paciente:</strong> ${pac.nombre}</p>
    <p><strong>Fecha cita:</strong> ${fechaJornada(jor)}</p>
    <p><strong>Distrito:</strong> ${jor}</p>
    <p><strong>Bloque:</strong> ${blq==='mañana'?'Mañana (8:30-12:30)':'Tarde (2:00-3:30)'}</p>
    <p style="margin-top:8px"><strong>Ruta de atención:</strong></p>
    <ol style="margin:4px 0 0 20px;font-size:13px">${info.map(r=>'<li>'+r+'</li>').join('')}</ol>
    <div class="btn-group"><button class="btn btn-primary" onclick="pdfCita('${nuevaCita.id}')">📄 Descargar comprobante PDF</button></div>
    <p style="font-size:12px;color:var(--text-dim);margin-top:12px">Guarde este código y presente el comprobante el día de la jornada.</p>
  </div>`;
}

async function boot(){
  $('app').innerHTML='<div class="login-page"><div class="login-card fade-up"><img src="'+LOGO+'" alt="IASD"><h1>Jornada de Salud</h1><p class="subtitle">Conectando con Supabase...</p></div></div>';
  await REMOTE.loadAll();
  render();
  setInterval(()=>{
    const tag=(document.activeElement&&document.activeElement.tagName)||'';
    const escribiendo=['INPUT','TEXTAREA','SELECT'].includes(tag);
    const medicoEnConsulta=CU&&CU.rol==='medico'&&(DB.g('turnos')||[]).some(t=>t.consultorioId===CU.consultorio&&t.estado==='en_atencion');

  },4000);
}
